<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Garmin dashboard</title>
    <!-- Home-screen web app on the phone: full screen, content runs under the status bar (padded with the safe-area insets) -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Garmin">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f2f5f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0f1720" media="(prefers-color-scheme: dark)">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header>
            <h1>Garmin dashboard</h1>
            <div class="bar">
                <span id="synced">Not synced yet</span>
                <select id="range" aria-label="Date range">
                    <option value="7" selected>Last 7 days</option>
                    <option value="14">Last 14 days</option>
                    <option value="28">Last 28 days</option>
                </select>
                <button id="export" title="Download a compact JSON summary to attach to an AI chat">Export<span class="long"> for
                    Claude</span></button>
                <button id="sync">Sync now</button>
            </div>
            <nav class="tabs views" aria-label="View">
                <button data-view="graphs" aria-pressed="true">Graphs</button>
                <button data-view="workouts" aria-pressed="false">Workouts</button>
            </nav>
        </header>
        <p id="msg" role="status" hidden></p>
        <div id="app"></div>
    </main>
    <dialog id="pop" aria-labelledby="pop-title"></dialog>
    <script src="app.js"></script>
</body>

</html>
